<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Mechanical - Executive Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #ffffff;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
            border-radius: 15px;
            padding: 25px 35px;
            margin-bottom: 25px;
            box-shadow: 0 10px 40px rgba(233, 69, 96, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-subtitle {
            font-size: 1rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255,255,255,0.2);
            padding: 10px 20px;
            border-radius: 25px;
        }

        .live-dot {
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        /* Company Overview */
        .company-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .overview-card {
            background: linear-gradient(145deg, #1e3a5f 0%, #16213e 100%);
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .overview-card.highlight {
            background: linear-gradient(145deg, #e94560 0%, #ff6b6b 100%);
        }

        .overview-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .overview-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .overview-subvalue {
            font-size: 0.9rem;
            margin-top: 5px;
            opacity: 0.9;
        }

        /* KPI Section */
        .kpi-section {
            background: linear-gradient(145deg, #1e3a5f 0%, #16213e 100%);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e94560;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .kpi-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .kpi-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .kpi-card.good {
            border-left: 4px solid #00ff88;
        }

        .kpi-card.warning {
            border-left: 4px solid #ff6b6b;
        }

        .kpi-name {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 1.8rem;
            font-weight: 700;
        }

        .kpi-target {
            font-size: 0.75rem;
            opacity: 0.7;
            margin-top: 5px;
        }

        .kpi-status {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.7rem;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .kpi-status.good {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .kpi-status.warning {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        /* Department Section */
        .department-section {
            margin-bottom: 30px;
        }

        .department-header {
            background: linear-gradient(135deg, #2d4a6f 0%, #1e3a5f 100%);
            border-radius: 15px 15px 0 0;
            padding: 20px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: background 0.3s;
        }

        .department-header:hover {
            background: linear-gradient(135deg, #3d5a7f 0%, #2e4a6f 100%);
        }

        .department-name {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .department-ytd {
            display: flex;
            gap: 30px;
            font-size: 0.95rem;
        }

        .department-ytd span {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .department-ytd .label {
            font-size: 0.7rem;
            opacity: 0.7;
            text-transform: uppercase;
        }

        .department-ytd .value {
            font-weight: 600;
        }

        .department-ytd .positive { color: #00ff88; }
        .department-ytd .negative { color: #ff6b6b; }

        .department-months {
            background: linear-gradient(145deg, #16213e 0%, #1a1a2e 100%);
            border-radius: 0 0 15px 15px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            border-top: none;
        }

        .month-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 12px 8px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .month-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }

        .month-card.over-budget {
            border-top: 3px solid #00ff88;
        }

        .month-card.under-budget {
            border-top: 3px solid #ff6b6b;
        }

        .month-card.future {
            opacity: 0.5;
        }

        .month-name {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #e94560;
        }

        .month-budget {
            font-size: 0.65rem;
            opacity: 0.7;
            margin-bottom: 3px;
        }

        .month-actual {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .month-variance {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
        }

        .month-variance.positive {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
        }

        .month-variance.negative {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }

        .month-progress {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .month-progress-bar {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s ease;
        }

        .month-progress-bar.good {
            background: linear-gradient(90deg, #00ff88, #00cc6a);
        }

        .month-progress-bar.warning {
            background: linear-gradient(90deg, #ff6b6b, #e94560);
        }

        /* Employee Section */
        .employee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .employee-card {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .employee-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .employee-stats {
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
        }

        .employee-stat {
            text-align: center;
        }

        .employee-stat .value {
            font-weight: 700;
            font-size: 1.1rem;
        }

        .employee-stat .label {
            font-size: 0.65rem;
            opacity: 0.7;
            text-transform: uppercase;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px;
            font-size: 1.2rem;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .department-months {
                grid-template-columns: repeat(6, 1fr);
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .department-months {
                grid-template-columns: repeat(4, 1fr);
            }

            .department-header {
                flex-direction: column;
                gap: 15px;
            }
        }

        @media (max-width: 480px) {
            .department-months {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Tab Navigation */
        .tab-nav {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #e94560 0%, #ff6b6b 100%);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>🔥 JC Mechanical</h1>
                <div class="header-subtitle">Executive Dashboard - 2026</div>
            </div>
            <div class="live-indicator">
                <div class="live-dot"></div>
                <span id="lastUpdate">Loading...</span>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div class="loading-spinner"></div>
            <span>Loading Dashboard Data...</span>
        </div>

        <!-- Dashboard Content (hidden until loaded) -->
        <div id="dashboardContent" style="display: none;">
            
            <!-- Company Overview -->
            <div class="company-overview" id="companyOverview">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Tab Navigation -->
            <div class="tab-nav">
                <button class="tab-btn active" onclick="showTab('kpis')">📊 KPIs</button>
                <button class="tab-btn" onclick="showTab('departments')">🏢 Departments</button>
                <button class="tab-btn" onclick="showTab('employees')">👷 Employees</button>
            </div>

            <!-- KPIs Tab -->
            <div id="kpis" class="tab-content active">
                <div class="kpi-section">
                    <div class="section-title">📈 Service Department KPIs</div>
                    <div class="kpi-grid" id="serviceKPIs"></div>
                </div>
                <div class="kpi-section">
                    <div class="section-title">🔧 Replacement/Installation KPIs</div>
                    <div class="kpi-grid" id="replacementKPIs"></div>
                </div>
                <div class="kpi-section">
                    <div class="section-title">🛠️ Maintenance KPIs</div>
                    <div class="kpi-grid" id="maintenanceKPIs"></div>
                </div>
            </div>

            <!-- Departments Tab -->
            <div id="departments" class="tab-content">
                <div id="departmentSections">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Employees Tab -->
            <div id="employees" class="tab-content">
                <div class="kpi-section">
                    <div class="section-title">👷 Top Performers</div>
                    <div class="employee-grid" id="employeeGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Configuration - YOUR APPS SCRIPT URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxz8P8Zz8fYHDRuvskSGL1NCHR_Rr3GmEcWNNCzNjNADwgKUjfG-z4w5STBcDQjAy5Dsw/exec';
        const REFRESH_INTERVAL = 300000; // 5 minutes

        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
        const CURRENT_MONTH = new Date().getMonth() + 1;

        // Tab Navigation
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        // Format currency
        function formatCurrency(amount) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(amount);
        }

        // Format percentage
        function formatPercent(value) {
            return parseFloat(value).toFixed(1) + '%';
        }

        // Load Dashboard Data
        async function loadDashboard() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                
                if (data.error) {
                    console.error('Dashboard error:', data.error);
                    return;
                }

                renderDashboard(data);
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                document.getElementById('lastUpdate').textContent = 
                    'Updated: ' + new Date().toLocaleTimeString();

            } catch (error) {
                console.error('Error loading dashboard:', error);
                document.getElementById('loading').innerHTML = 
                    '<span>⚠️ Error loading data. Retrying...</span>';
                setTimeout(loadDashboard, 5000);
            }
        }

        // Render Dashboard
        function renderDashboard(data) {
            renderCompanyOverview(data);
            renderKPIs(data.kpis);
            renderDepartments(data.departments);
            renderEmployees(data.employees);
        }

        // Render Company Overview
        function renderCompanyOverview(data) {
            const container = document.getElementById('companyOverview');
            const company = data.company;
            
            container.innerHTML = `
                <div class="overview-card highlight">
                    <div class="overview-label">Annual Budget</div>
                    <div class="overview-value">${formatCurrency(company.totalBudget)}</div>
                    <div class="overview-subvalue">FY 2026 Target</div>
                </div>
                <div class="overview-card">
                    <div class="overview-label">YTD Actual</div>
                    <div class="overview-value">${formatCurrency(company.ytdActual)}</div>
                    <div class="overview-subvalue">${company.percentComplete}% of Annual</div>
                </div>
                <div class="overview-card">
                    <div class="overview-label">YTD Budget</div>
                    <div class="overview-value">${formatCurrency(company.ytdBudget)}</div>
                    <div class="overview-subvalue">Target to Date</div>
                </div>
                <div class="overview-card">
                    <div class="overview-label">Variance</div>
                    <div class="overview-value" style="color: ${company.variance >= 0 ? '#00ff88' : '#ff6b6b'}">
                        ${company.variance >= 0 ? '+' : ''}${formatCurrency(company.variance)}
                    </div>
                    <div class="overview-subvalue">${company.variance >= 0 ? 'Over Budget ✓' : 'Under Budget'}</div>
                </div>
                <div class="overview-card">
                    <div class="overview-label">Total Jobs</div>
                    <div class="overview-value">${data.jobCount}</div>
                    <div class="overview-subvalue">Completed YTD</div>
                </div>
            `;
        }

        // Render KPIs
        function renderKPIs(kpis) {
            if (!kpis || !kpis.service) return;

            // Service KPIs
            document.getElementById('serviceKPIs').innerHTML = `
                <div class="kpi-card ${kpis.service.dfoStatus}">
                    <div class="kpi-name">DFO Rate</div>
                    <div class="kpi-value">${kpis.service.dfoRate}%</div>
                    <div class="kpi-target">Target: < ${kpis.service.dfoTarget}%</div>
                    <div class="kpi-status ${kpis.service.dfoStatus}">${kpis.service.dfoStatus === 'good' ? '✓ On Track' : '⚠ Needs Attention'}</div>
                </div>
                <div class="kpi-card ${kpis.service.avgTicketStatus}">
                    <div class="kpi-name">Avg Service Ticket</div>
                    <div class="kpi-value">${formatCurrency(kpis.service.avgTicket)}</div>
                    <div class="kpi-target">Target: ${formatCurrency(kpis.service.avgTicketTarget)}+</div>
                    <div class="kpi-status ${kpis.service.avgTicketStatus}">${kpis.service.avgTicketStatus === 'good' ? '✓ On Track' : '⚠ Below Target'}</div>
                </div>
                <div class="kpi-card ${kpis.service.callbackStatus}">
                    <div class="kpi-name">Callback Rate</div>
                    <div class="kpi-value">${kpis.service.callbackRate}%</div>
                    <div class="kpi-target">Target: < ${kpis.service.callbackTarget}%</div>
                    <div class="kpi-status ${kpis.service.callbackStatus}">${kpis.service.callbackStatus === 'good' ? '✓ On Track' : '⚠ High Callbacks'}</div>
                </div>
                <div class="kpi-card good">
                    <div class="kpi-name">Total Service Calls</div>
                    <div class="kpi-value">${kpis.service.totalServiceCalls}</div>
                    <div class="kpi-target">DFO: ${kpis.service.dfoCount} calls</div>
                </div>
            `;

            // Replacement KPIs
            if (kpis.replacement) {
                document.getElementById('replacementKPIs').innerHTML = `
                    <div class="kpi-card ${kpis.replacement.avgTicketStatus}">
                        <div class="kpi-name">Avg Replacement Ticket</div>
                        <div class="kpi-value">${formatCurrency(kpis.replacement.avgTicket)}</div>
                        <div class="kpi-target">Target: ${formatCurrency(kpis.replacement.avgTicketTarget)}+</div>
                        <div class="kpi-status ${kpis.replacement.avgTicketStatus}">${kpis.replacement.avgTicketStatus === 'good' ? '✓ On Track' : '⚠ Below Target'}</div>
                    </div>
                    <div class="kpi-card good">
                        <div class="kpi-name">Total Replacements</div>
                        <div class="kpi-value">${kpis.replacement.totalJobs}</div>
                        <div class="kpi-target">Revenue: ${formatCurrency(kpis.replacement.totalRevenue)}</div>
                    </div>
                    <div class="kpi-card good">
                        <div class="kpi-name">Overall Avg Ticket</div>
                        <div class="kpi-value">${formatCurrency(kpis.overall.avgTicketAll)}</div>
                        <div class="kpi-target">All Departments</div>
                    </div>
                    <div class="kpi-card good">
                        <div class="kpi-name">Total Revenue</div>
                        <div class="kpi-value">${formatCurrency(kpis.overall.totalRevenue)}</div>
                        <div class="kpi-target">${kpis.overall.totalJobs} Total Jobs</div>
                    </div>
                `;
            }

            // Maintenance KPIs
            if (kpis.maintenance) {
                document.getElementById('maintenanceKPIs').innerHTML = `
                    <div class="kpi-card ${kpis.maintenance.avgTicketStatus}">
                        <div class="kpi-name">Avg Maintenance Ticket</div>
                        <div class="kpi-value">${formatCurrency(kpis.maintenance.avgTicket)}</div>
                        <div class="kpi-target">Target: ${formatCurrency(kpis.maintenance.avgTicketTarget)}+</div>
                        <div class="kpi-status ${kpis.maintenance.avgTicketStatus}">${kpis.maintenance.avgTicketStatus === 'good' ? '✓ On Track' : '⚠ Below Target'}</div>
                    </div>
                    <div class="kpi-card good">
                        <div class="kpi-name">Total Maintenance Jobs</div>
                        <div class="kpi-value">${kpis.maintenance.totalJobs}</div>
                        <div class="kpi-target">Club Members</div>
                    </div>
                `;
            }
        }

        // Render Departments
        function renderDepartments(departments) {
            if (!departments) return;

            const container = document.getElementById('departmentSections');
            let html = '';

            const deptOrder = [
                'Residential Replacement',
                'Residential Service', 
                'Residential Maintenance',
                'Commercial Replacement',
                'Commercial Service',
                'Commercial Maintenance',
                'New Construction'
            ];

            deptOrder.forEach(deptName => {
                const dept = departments[deptName];
                if (!dept) return;

                const varianceClass = dept.ytdVariance >= 0 ? 'positive' : 'negative';

                html += `
                    <div class="department-section">
                        <div class="department-header">
                            <div class="department-name">${deptName}</div>
                            <div class="department-ytd">
                                <span>
                                    <span class="label">Annual Budget</span>
                                    <span class="value">${formatCurrency(dept.annualBudget)}</span>
                                </span>
                                <span>
                                    <span class="label">YTD Actual</span>
                                    <span class="value">${formatCurrency(dept.ytdActual)}</span>
                                </span>
                                <span>
                                    <span class="label">YTD Budget</span>
                                    <span class="value">${formatCurrency(dept.ytdBudget)}</span>
                                </span>
                                <span>
                                    <span class="label">Variance</span>
                                    <span class="value ${varianceClass}">${dept.ytdVariance >= 0 ? '+' : ''}${formatCurrency(dept.ytdVariance)}</span>
                                </span>
                                <span>
                                    <span class="label">% Complete</span>
                                    <span class="value">${dept.annualPercentComplete}%</span>
                                </span>
                            </div>
                        </div>
                        <div class="department-months">
                            ${renderMonthCards(dept.months)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render Month Cards
        function renderMonthCards(months) {
            let html = '';

            for (let m = 1; m <= 12; m++) {
                const month = months[m];
                const isFuture = m > CURRENT_MONTH;
                const isOver = month.actual >= month.budget;
                const progressPercent = Math.min(100, parseFloat(month.percentComplete) || 0);

                html += `
                    <div class="month-card ${isFuture ? 'future' : ''} ${isOver ? 'over-budget' : 'under-budget'}">
                        <div class="month-name">${MONTH_NAMES[m-1]}</div>
                        <div class="month-budget">Budget: ${formatCurrency(month.budget)}</div>
                        <div class="month-actual">${formatCurrency(month.actual)}</div>
                        <div class="month-variance ${month.variance >= 0 ? 'positive' : 'negative'}">
                            ${month.variance >= 0 ? '+' : ''}${formatCurrency(month.variance)}
                        </div>
                        <div class="month-progress">
                            <div class="month-progress-bar ${isOver ? 'good' : 'warning'}" 
                                 style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                `;
            }

            return html;
        }

        // Render Employees
        function renderEmployees(employees) {
            if (!employees || employees.length === 0) {
                document.getElementById('employeeGrid').innerHTML = 
                    '<p style="opacity: 0.7;">No employee data available yet.</p>';
                return;
            }

            let html = '';
            employees.forEach((emp, index) => {
                html += `
                    <div class="employee-card">
                        <div>
                            <div class="employee-name">${index + 1}. ${emp.name}</div>
                        </div>
                        <div class="employee-stats">
                            <div class="employee-stat">
                                <div class="value">${formatCurrency(emp.totalRevenue)}</div>
                                <div class="label">Revenue</div>
                            </div>
                            <div class="employee-stat">
                                <div class="value">${emp.jobCount}</div>
                                <div class="label">Jobs</div>
                            </div>
                            <div class="employee-stat">
                                <div class="value">${formatCurrency(emp.avgTicket)}</div>
                                <div class="label">Avg Ticket</div>
                            </div>
                            <div class="employee-stat">
                                <div class="value" style="color: ${parseFloat(emp.dfoRate) < 5 ? '#00ff88' : '#ff6b6b'}">${emp.dfoRate}%</div>
                                <div class="label">DFO Rate</div>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('employeeGrid').innerHTML = html;
        }

        // Initialize
        loadDashboard();
        setInterval(loadDashboard, REFRESH_INTERVAL);
    </script>
</body>
</html>
