<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC Mechanical - Live KPI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto+Condensed:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        /* Live Indicator */
        .live-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4CAF50;
            border-radius: 20px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
        }

        .live-dot {
            width: 10px;
            height: 10px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .last-update {
            font-size: 0.85rem;
            color: #C0C0C0;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1F4E78 0%, #FF6B35 100%);
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 3rem;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            letter-spacing: 2px;
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(58,58,58,0.95);
            padding: 25px;
            border-radius: 8px;
            border-left: 5px solid #4472C4;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #C0C0C0;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            color: #FF6B35;
            letter-spacing: 1px;
        }

        .stat-subtext {
            font-size: 0.85rem;
            color: #888;
            margin-top: 5px;
        }

        /* Monthly Grid */
        .monthly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .month-card {
            background: rgba(58,58,58,0.95);
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #FF6B35;
            transition: all 0.3s ease;
        }

        .month-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255,107,53,0.3);
        }

        .month-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            color: #FF6B35;
        }

        .month-percent {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: #FFC107;
        }

        .month-amount {
            font-size: 1.1rem;
            color: #C0C0C0;
            font-weight: 700;
        }

        .month-actual {
            font-size: 0.95rem;
            color: #4CAF50;
            margin-top: 8px;
            font-weight: 700;
        }

        .month-variance {
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .positive { color: #4CAF50; }
        .negative { color: #f44336; }

        /* Loading Spinner */
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 1.5rem;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #FF6B35;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Section Headers */
        .section-header {
            background: linear-gradient(135deg, #1F4E78 0%, #4472C4 100%);
            padding: 20px 30px;
            border-radius: 8px;
            margin: 40px 0 20px 0;
        }

        .section-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 2px;
        }

        /* Error Message */
        .error {
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="live-indicator">
        <div class="live-dot"></div>
        <div>
            <div style="font-weight: 700; font-size: 0.9rem;">LIVE</div>
            <div class="last-update" id="lastUpdate">Loading...</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1>JC MECHANICAL LLC</h1>
            <div class="subtitle">Live Weekly KPI Dashboard - Residential Replacement</div>
        </div>

        <div id="dashboard">
            <div class="loading">
                <div class="spinner"></div>
                <div>Loading dashboard data...</div>
            </div>
        </div>
    </div>

    <script>
        // ====================================================================
        // CONFIGURATION - REPLACE WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        // ====================================================================
        
        const API_URL = 'https://script.google.com/macros/s/AKfycbxrxaXeGxrM0LHuxqQVyH7w0rEklbz_EBG2Qb5kdCxM/dev';
        
        // Replace the above with your actual deployment URL like:
        //const API_URL = 'https://script.google.com/macros/s/AKfycbxrxaXeGxrM0LHuxqQVyH7w0rEklbz_EBG2Qb5kdCxM/dev';
        
        // Auto-refresh interval (5 minutes = 300000 milliseconds)
        const REFRESH_INTERVAL = 300000;
        
        // ====================================================================
        // DASHBOARD LOADER
        // ====================================================================
        
        let dashboardData = null;
        
        async function loadDashboard() {
            try {
                const response = await fetch(`${API_URL}?action=dashboard`);
                
                if (!response.ok) {
                    throw new Error('Failed to fetch dashboard data');
                }
                
                dashboardData = await response.json();
                
                if (dashboardData.error) {
                    throw new Error(dashboardData.error);
                }
                
                renderDashboard();
                updateLastUpdateTime();
                
            } catch (error) {
                showError(error.message);
            }
        }
        
        function renderDashboard() {
            const container = document.getElementById('dashboard');
            
            const html = `
                <!-- Annual Stats -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Annual Budget</div>
                        <div class="stat-value">$${formatNumber(dashboardData.annual.budget)}</div>
                        <div class="stat-subtext">2026 Residential Replacement</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Year-to-Date Actual</div>
                        <div class="stat-value">$${formatNumber(dashboardData.annual.actualYTD)}</div>
                        <div class="stat-subtext">${dashboardData.annual.percentComplete.toFixed(1)}% of annual goal</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Best Week</div>
                        <div class="stat-value">$${dashboardData.summary.bestWeek ? formatNumber(dashboardData.summary.bestWeek.actual) : '0'}</div>
                        <div class="stat-subtext">${dashboardData.summary.bestWeek ? dashboardData.summary.bestWeek.weekKey : 'N/A'}</div>
                    </div>
                    
                    <div class="stat-card">
                        <div class="stat-label">Average Weekly</div>
                        <div class="stat-value">$${formatNumber(dashboardData.summary.avgWeekly)}</div>
                        <div class="stat-subtext">Across all weeks with data</div>
                    </div>
                </div>
                
                <!-- Monthly Breakdown -->
                <div class="section-header">
                    <h2>Monthly Revenue Distribution</h2>
                </div>
                
                <div class="monthly-grid">
                    ${dashboardData.months.map(month => `
                        <div class="month-card">
                            <div class="month-name">${month.name}</div>
                            <div class="month-percent">${month.percent.toFixed(2)}%</div>
                            <div class="month-amount">Budget: $${formatNumber(month.budget)}</div>
                            <div class="month-actual">Actual: $${formatNumber(month.actual)}</div>
                            <div class="month-variance ${month.variance >= 0 ? 'positive' : 'negative'}">
                                ${month.variance >= 0 ? '+' : ''}$${formatNumber(month.variance)} 
                                (${month.variancePercent.toFixed(1)}%)
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function showError(message) {
            const container = document.getElementById('dashboard');
            container.innerHTML = `
                <div class="error">
                    <h2>⚠️ Error Loading Dashboard</h2>
                    <p>${message}</p>
                    <p style="margin-top: 15px; font-size: 0.9rem;">
                        Make sure you've replaced the API_URL in the code with your Google Apps Script Web App URL.
                    </p>
                    <button onclick="loadDashboard()" style="margin-top: 20px; padding: 10px 20px; background: #FF6B35; border: none; border-radius: 5px; color: white; cursor: pointer; font-size: 1rem;">
                        Retry
                    </button>
                </div>
            `;
        }
        
        function updateLastUpdateTime() {
            const lastUpdateEl = document.getElementById('lastUpdate');
            const now = new Date();
            lastUpdateEl.textContent = now.toLocaleTimeString();
        }
        
        function formatNumber(num) {
            return Math.round(num).toLocaleString();
        }
        
        // ====================================================================
        // AUTO-REFRESH
        // ====================================================================
        
        function startAutoRefresh() {
            setInterval(() => {
                console.log('Auto-refreshing dashboard...');
                loadDashboard();
            }, REFRESH_INTERVAL);
        }
        
        // ====================================================================
        // INITIALIZE
        // ====================================================================
        
        // Load dashboard on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            startAutoRefresh();
        });
        
        // Manual refresh button (optional - add to UI if desired)
        function refreshDashboard() {
            loadDashboard();
        }
    </script>
</body>
</html>
